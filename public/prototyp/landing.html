<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Topflix | Na co se dívat dnes večer</title>
    <link rel="stylesheet" href="prototyp.css">
</head>
<body>
    <a class="skip" href="#uvod">Přeskočit na obsah</a>

    <section class="hero" id="uvod">
        <p class="mark">Topflix</p>
        <div class="hero-copy">
            <h1>“Na co se dívat dnes večer”</h1>
            <p class="lede">Šest titulů nad 70 %.</p>
            <a class="link" href="/#dnes">Otevřít výběr</a>
        </div>
    </section>

    <section class="rule" aria-labelledby="rule-title">
        <p class="mark mark-ink">Topflix</p>
        <div class="rule-copy">
            <p class="eyebrow">Dnes večer</p>
            <h2 id="rule-title">Šest titulů nad 70 %.</h2>
        </div>
    </section>

    <section class="seventy" aria-label="Hranice sedmdesáti procent">
        <img src="seventy.jpg" alt="Velké číslo 70 a tři záběry: Teď na Netflixu, Novější, Jistější volba.">
    </section>

    <section class="device" aria-labelledby="device-title">
        <p class="mark">Topflix</p>
        <div class="device-photo" role="img" aria-label="Telefon se seznamem titulů, u každého jedno skóre a tlačítko služby."></div>
        <div class="device-copy">
            <h2 id="device-title">Jeden řádek.<br>Jedno skóre.</h2>
        </div>
    </section>

    <section class="room" aria-labelledby="room-title">
        <p class="display">Topflix</p>
        <div class="room-copy">
            <h2 id="room-title">“Bez katalogu.”</h2>
            <p>Vyberete za minutu.</p>
        </div>
    </section>

    <section class="close" aria-labelledby="close-title">
        <p class="mark mark-center">Topflix</p>
        <h2 id="close-title">“Dnes večer už má výběr.”</h2>
        <a class="pill" href="/#dnes">Podívat se</a>
        <hr>
        <p class="fine">Zdarma. Česky. Bez účtu.</p>
    </section>
</body>
</html>
