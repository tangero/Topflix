# Cloudflare Worker for Cron Triggers
# Netflix updates TOP10 weekly on Tuesday, Netflix New changes more often
# We run Tuesday (TOP10 update day) and Friday (mid-week catch-up)

name = "topflix-cron"
main = "workers/cron.js"
compatibility_date = "2024-01-01"

# Cron trigger: Tuesday and Friday at 07:00 UTC (09:00 CEST / 08:00 CET).
# Day names on purpose: Cloudflare counts weekdays from 1 = Sunday, so the old "2,5"
# fired on Monday and Thursday, before Netflix published the new Top 10.
[triggers]
crons = ["0 7 * * TUE,FRI"]

# Runtime secret, not committed. Same value as ADMIN_API_KEY on the Pages project:
#   wrangler secret put ADMIN_API_KEY --config wrangler-cron.toml

# Environment variables
[vars]
PAGES_URL = "https://www.topflix.cz"  # Production URL
